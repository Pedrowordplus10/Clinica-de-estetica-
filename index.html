<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ef">
  <meta name="description" content="Conheça Damaris Vieira, agende seu horário e descubra nossos procedimentos.">
  <title>Damaris Vieira | Cuidado que floresce</title>
  <style>
    :root {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #403832;
      background: #f7f3ef;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 36px 20px;
      background:
        radial-gradient(ellipse at 50% 0%, rgb(218 190 177 / 36%), transparent 48%),
        #f7f3ef;
    }

    main {
      width: min(100%, 440px);
      padding: 36px 30px 28px;
      border: 1px solid rgb(137 111 94 / 12%);
      border-radius: 28px;
      background: rgb(255 253 250 / 82%);
      box-shadow: 0 22px 70px rgb(87 63 48 / 9%);
      text-align: center;
    }

    .profile-photo {
      width: 104px;
      height: 104px;
      display: block;
      margin: 0 auto 22px;
      border: 3px solid #fffdfa;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 30%;
      box-shadow: 0 0 0 6px rgb(230 213 202 / 25%);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #9c7d6a;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #4a3d35;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 8vw, 2.45rem);
      font-weight: 500;
      letter-spacing: -0.035em;
    }

    .bio {
      max-width: 310px;
      margin: 12px auto 28px;
      color: #81756d;
      font-size: 0.98rem;
      line-height: 1.65;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 14px 18px;
      border: 1px solid #e5d8ce;
      border-radius: 16px;
      background: #fffdfa;
      color: #54473e;
      font-size: 0.98rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease;
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: #cbb2a2;
      background: #f8eee8;
    }

    .link:focus-visible {
      outline: 3px solid #b78e79;
      outline-offset: 4px;
    }

    .link svg {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.7;
    }

    footer {
      margin-top: 26px;
      color: #aa988c;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.9rem;
      font-style: italic;
    }

    @media (max-width: 380px) {
      body {
        padding: 20px 14px;
      }

      main {
        padding: 30px 20px 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <img class="profile-photo" src="damaris-vieira.png" alt="Damaris Vieira">
    <p class="eyebrow">Estética &amp; bem-estar</p>
    <h1>Damaris Vieira</h1>
    <p class="bio">Cuidado que floresce. Um momento para você se sentir ainda mais bonita.</p>
